<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เปลี่ยนรหัสผ่าน — ระบบแจก e-Token TFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500;600;700&family=Anuphan:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shared/styles.css">
</head>
<body class="accent-admin">

<main class="layout-form">
  <header style="margin-bottom:var(--s-xl)">
    <div class="row row-between">
      <span class="label" style="margin:0">ตั้งค่าบัญชี</span>
      <button type="button" class="theme-toggle-btn" aria-label="สลับโหมดมืด/สว่าง">☀️</button>
    </div>
    <h1 class="headline" style="margin-top:var(--s-xs)">เปลี่ยนรหัสผ่าน</h1>
    <p class="muted" id="who" style="margin:var(--s-xs) 0 0">กำลังโหลด...</p>
  </header>

  <section class="card">
    <!-- ข้อความเตือนด้านความปลอดภัยตาม SCOPE.md — ต้องปรากฏในหน้าเปลี่ยนรหัสผ่านด้วย -->
    <div class="msg msg-warn" role="note" style="margin-bottom:var(--s-md)">
      รหัสผ่านที่ได้รับตอนแรกเป็นรหัสชั่วคราว ห้ามใช้รหัสผ่านส่วนตัวหรือรหัสที่ใช้ซ้ำกับบัญชีอื่นเด็ดขาด
      เพราะระบบนี้ไม่ได้ทำระบบรักษาความปลอดภัยระดับสูง (ไม่มี 2FA ไม่มี rate-limit เข้มงวด)
    </div>

    <form id="cp-form" novalidate>
      <div class="field">
        <label class="label" for="new-password">รหัสผ่านใหม่</label>
        <input class="input" id="new-password" type="password" autocomplete="new-password" required>
        <span class="hint">อย่างน้อย 6 ตัวอักษร</span>
      </div>

      <div class="field">
        <label class="label" for="confirm-password">ยืนยันรหัสผ่านใหม่</label>
        <input class="input" id="confirm-password" type="password" autocomplete="new-password" required>
      </div>

      <div id="error" class="msg msg-error" role="alert" aria-live="polite"></div>
      <div id="ok" class="msg msg-ok" role="status" aria-live="polite"></div>

      <div class="action-isolated row" style="gap:var(--s-md)">
        <button class="btn btn-admin" id="submit" type="submit">บันทึกรหัสผ่านใหม่</button>
        <!-- เปลี่ยนรหัสผ่าน "ไม่บังคับ" ตาม SCOPE.md — มีปุ่มข้ามเสมอ -->
        <a class="btn" id="skip" href="login.html">ข้าม</a>
      </div>
    </form>
  </section>
</main>

<script type="module">
import './shared/theme.js';
import { requireRole, changePassword, getRoleHomePage } from './shared/auth.js';
import { toShortCode } from './shared/firebase-init.js';

const form = document.getElementById('cp-form');
const newEl = document.getElementById('new-password');
const confirmEl = document.getElementById('confirm-password');
const errorEl = document.getElementById('error');
const okEl = document.getElementById('ok');
const submitEl = document.getElementById('submit');
const skipEl = document.getElementById('skip');
const whoEl = document.getElementById('who');

// เปิดหน้านี้ได้ทุกบทบาท ขอแค่ล็อกอินแล้ว
const { profile } = await requireRole(['participant', 'trainer', 'admin']);
const home = getRoleHomePage(profile.role);

whoEl.textContent = `${profile.fullName || ''} (${toShortCode(profile.username)})`.trim();
skipEl.href = home;
skipEl.textContent = profile.mustChangePassword ? 'ข้ามไปก่อน' : 'ย้อนกลับ';

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.textContent = '';
  okEl.textContent = '';

  if (newEl.value !== confirmEl.value) {
    errorEl.textContent = 'รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน';
    return;
  }

  submitEl.disabled = true;
  submitEl.textContent = 'กำลังบันทึก...';

  try {
    await changePassword(newEl.value);
    okEl.textContent = 'เปลี่ยนรหัสผ่านเรียบร้อยแล้ว กำลังพาไปหน้าหลัก...';
    setTimeout(() => location.replace(home), 900);
  } catch (err) {
    errorEl.textContent = err.message || 'เปลี่ยนรหัสผ่านไม่สำเร็จ กรุณาลองใหม่อีกครั้ง';
    submitEl.disabled = false;
    submitEl.textContent = 'บันทึกรหัสผ่านใหม่';
  }
});
</script>

</body>
</html>
